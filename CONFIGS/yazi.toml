# A TOML linter such as https://taplo.tamasfe.dev/ can use this schema to validate your config.
# If you encounter any issues, please make an issue at https://github.com/yazi-rs/schemas.
[headsup]
disable_exec_warn = true
[mgr]
# ratio          = [ 1, 3, 4 ]
ratio          = [ 0, 4, 4 ]
#sort_by        = "modified"
sort_by        = "mtime"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
#linemode       = "none"
linemode       = "mtime"
show_hidden    = true
show_symlink   = true
scrolloff      = 5

[preview]
tab_size        = 2
max_width       = 600
max_height      = 900
cache_dir       = ""
image_filter    = "triangle"
image_quality   = 75
ueberzug_scale  = 1
ueberzug_offset = [ 0, 0, 0, 0 ]

[opener]
edit = [
        { run = 'nem %s', block = true, for = "unix" },
        ]
open = [
	{ run = 'xdg-open "$@"',                desc = "Open", for = "linux" },
	{ run = 'open "$@"',                    desc = "Open", for = "macos" },
	{ run = 'start "" "%1"', orphan = true, desc = "Open", for = "windows" }
]
reveal = [
	{ run = 'open -R "$1"',                          desc = "Reveal", for = "macos" },
	{ run = 'explorer /select, "%1"', orphan = true, desc = "Reveal", for = "windows" },
	{ run = '''exiftool "$1"; echo "Press enter to exit"; read''', block = true, desc = "Show EXIF", for = "unix" },
]
extract = [
	# { run = 'unar "$1"', desc = "Extract here", for = "unix" },
	{ run = 'ouch d -y "$@"', desc = "Extract here with ouch", for = "unix" },
]
play = [
	{ run = 'mpv "$@"', orphan = true, for = "unix" },
	{ run = 'mpv "%1"', orphan = true, for = "windows" },
	{ run = '''mediainfo "$1"; echo "Press enter to exit"; read''', block = true, desc = "Show media info", for = "unix" },
]
diff = [
	{ run = 'meld %s', orphan = true, desc = "meld", for = "unix" },
]

[open]
rules = [
	{ url = "*/", use = [ "edit", "open", "reveal" ] },

	{ mime = "text/*",  use = [ "edit", "reveal", "diff" ] },
	{ mime = "image/*", use = [ "open", "reveal" ] },
	{ mime = "video/*", use = [ "play", "reveal" ] },
	{ mime = "audio/*", use = [ "play", "reveal" ] },
	{ mime = "inode/x-empty", use = [ "edit", "reveal" ] },

	{ mime = "application/json", use = [ "edit", "reveal" ] },
	{ mime = "*/javascript",     use = [ "edit", "reveal" ] },

	{ mime = "application/zip",             use = [ "extract", "reveal" ] },
	# { mime = "application/gzip",            use = [ "extract", "reveal" ] },
	{ mime = "application/tar",           use = [ "extract", "reveal" ] },
	{ mime = "application/bzip",          use = [ "extract", "reveal" ] },
	{ mime = "application/bzip2",         use = [ "extract", "reveal" ] },
	{ mime = "application/7z-compressed", use = [ "extract", "reveal" ] },
	{ mime = "application/rar",           use = [ "extract", "reveal" ] },
	{ mime = "application/xz",              use = [ "extract", "reveal" ] },

	{ url = "*", use = [ "open", "reveal" ] },
]

[tasks]
bizarre_retry    = 5
image_alloc      = 536870912  # 512MB
image_bound      = [ 0, 0 ]
suppress_preload = false

[plugin]

previewers = [
	##### { name = "*/", run = "hek-fzf-preview", sync = true },
	########## { name = "*/", run = "folder", sync = true },
	{ url = "*/",run  = 'piper -- eza -TL=3 --color=always --icons=always --group-directories-first --no-quotes "$1"'},
    { url = "*.hpy", run  = 'piper -- rich -x nim -j --left --panel=none --guides --line-numbers --force-terminal "$1"'},
    { url = "*.md", run  = 'piper -- rich -j --left --panel none --line-numbers --force-terminal "$1"'},
    { url = "*.py", run  = 'piper -- rich -j --left --panel none --line-numbers --force-terminal "$1"'},
    { url = "*.adb", run  = 'piper -- rich -j --left --panel none --line-numbers --force-terminal "$1"'},
    { url = "*.ads", run  = 'piper -- rich -j --left --panel none --line-numbers --force-terminal "$1"'},
    { url = "*.toml", run  = 'piper -- rich -j --left --panel none --line-numbers --force-terminal "$1"'},
    { url = "*.ksh", run  = 'piper -- rich -j --left --panel none --line-numbers --force-terminal "$1"'},
    { url = "*.sh", run  = 'piper -- rich -j --left --panel none --line-numbers --force-terminal "$1"'},
    { url = "*.txt", run  = 'piper -- rich -j --left --panel none --line-numbers --force-terminal "$1"'},
    { url = "*.lua", run  = 'piper -- rich -j --left --panel none --line-numbers --force-terminal "$1"'},
    { url = "*.pl", run  = 'piper -- rich -j --left --panel none --line-numbers --force-terminal "$1"'},
	# Code
	{ mime = "text/*",                 run = "rich-preview" },
	{ mime = "*/xml",                  run = "rich-preview" },
	{ mime = "*/javascript",           run = "rich-preview" },
	{ mime = "*/x-wine-extension-ini", run = "rich-preview" },
	# JSON
	{ mime = "application/json", run = "rich-preview" },
	# CSV / RST / Jupyter
	{ url = "*.csv",   run = "rich-preview" },
	{ url = "*.rst",   run = "rich-preview" },
	{ url = "*.ipynb", run = "rich-preview" },
	# Image
	{ mime = "image/vnd.djvu", run = "noop" },
	{ mime = "image/*",        run = "image" },
	# Video
	{ mime = "video/*", run = "video" },
	# PDF
	{ mime = "application/pdf", run = "pdf" },
	# Archive
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", run = "ouch" },
        # Office Documents
        # { mime = "application/openxmlformats-officedocument.*", run = "soffice" },
        # { mime = "application/oasis.opendocument.*", run = "soffice" },
        # { mime = "application/ms-*", run = "soffice" },
        # { mime = "application/msword", run = "soffice" },
	# { name = "*.docx", run = 'piper -- soffice --headless --cat "$1"'},

	# Fallback
	#{ url = "*", run = "file" },
	#{ url = "*", run = "hek-fzf-preview" },
	{ url = "*", run = 'piper -- hexyl --border=none --terminal-width=$w "$1"'},
]

prepend_fetchers = [
	{ id = "simple-tag", url = "*",  run = "simple-tag", group = "simple-tag" },
	{ id = "simple-tag", url = "*/", run = "simple-tag", group = "simple-tag" },
]

[input]
# cd
cd_title  = "Change directory:"
cd_origin = "top-center"
cd_offset = [ 0, 2, 50, 3 ]

# create
create_title  = ["Create:", "Create (dir):"]
create_origin = "top-center"
create_offset = [ 0, 2, 50, 3 ]

# rename
rename_title  = "Rename:"
rename_origin = "hovered"
rename_offset = [ 0, 1, 50, 3 ]

# trash
trash_title 	= "Move {n} selected file{s} to trash? (y/N)"
trash_origin	= "top-center"
trash_offset	= [ 0, 2, 50, 3 ]

# delete
delete_title 	= "Delete {n} selected file{s} permanently? (y/N)"
delete_origin	= "top-center"
delete_offset	= [ 0, 2, 50, 3 ]

# filter
filter_title  = "Filter:"
filter_origin = "top-center"
filter_offset = [ 0, 2, 50, 3 ]

# find
find_title  = [ "Find next:", "Find previous:" ]
find_origin = "top-center"
find_offset = [ 0, 2, 50, 3 ]

# search

# shell
shell_title  = [ "Shell:", "Shell (block):" ]
shell_origin = "top-center"
shell_offset = [ 0, 2, 50, 3 ]

# overwrite
overwrite_title  = "Overwrite an existing file? (y/N)"
overwrite_origin = "top-center"
overwrite_offset = [ 0, 2, 50, 3 ]

# quit
quit_title  = "{n} task{s} running, sure to quit? (y/N)"
quit_origin = "top-center"
quit_offset = [ 0, 2, 50, 3 ]

[pick]
open_title  = "Open with:"
open_origin = "hovered"
open_offset = [ 0, 1, 50, 7 ]

[which]
sort_by        = "none"
sort_sensitive = false
sort_reverse   = false
