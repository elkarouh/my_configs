theme= "onelight"

[editor.cursor-shape]
# insert = "bar"
insert = "block"
normal = "block"
select = "underline"

[editor]
scrolloff = 10
mouse = true
line-number = "absolute"
cursorline = true
shell = ["ksh", "-c"]
true-color = true # force the theme to show colors
color-modes = true
auto-save = true # save when window loses focus
# bufferline = "always"
bufferline = "multiple"
# line-number = "relative"
rulers = [130] # show a ruler at column 130
# scroll-lines = 1
completion-trigger-len = 1
popup-border = "all"
insecure = true

[editor.search]
smart-case = true

[editor.statusline]
left = ["mode", "spinner"]
center = ["file-name"]
right = ["diagnostics", "selections", "position", "position-percentage", "file-encoding", "file-line-ending"]
separator = "│"
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

[editor.lsp]
display-inlay-hints = true

# left = ["mode", "spinner", "file-name", "read-only-indicator", "file-modification-indicator"]
# center = ["diagnostics"]
# right = ["selections", "register", "position", "file-encoding"]

[editor.whitespace.render]
space = "all"
tab = "all"
newline = "none"

[editor.whitespace.characters]
space = "·"
nbsp = "⍽"
tab = "→"
newline = "⏎"

[editor.indent-guides]
character = "|"
render = true

[editor.gutters]
layout = ["diff", "diagnostics", "line-numbers", "spacer"]

[editor.file-picker]
hidden = false
################################# NORMAL MODE KEY BINDINGS###########################################################
[keys.normal]
esc = ["collapse_selection", "keep_primary_selection"]
# gw to go to a place in the text (vgw if you also want to select)
# move line down/up
A-down = ["extend_to_line_bounds", "delete_selection", "move_line_down","paste_before"]
A-up =   ["extend_to_line_bounds", "delete_selection", "move_line_up", "paste_before"]
C-right = "move_next_word_start"
C-left = "move_prev_word_end"

# Vim muscle memory - motion/navigation
"{" = ["goto_prev_paragraph", "collapse_selection"]
"}" = ["goto_next_paragraph", "collapse_selection"]
0 = "goto_line_start"
"$" = "goto_line_end"
"^" = "goto_first_nonwhitespace"
G = "goto_file_end"
"%" = "match_brackets"
j = "move_line_down"
k = "move_line_up"

# Vim muscle memory - word motions (collapse selection to single cursor like vim)
w = ["move_next_word_start", "move_char_right", "collapse_selection"]
W = ["move_next_long_word_start", "move_char_right", "collapse_selection"]
e = ["move_next_word_end", "collapse_selection"]
E = ["move_next_long_word_end", "collapse_selection"]
b = ["move_prev_word_start", "collapse_selection"]
B = ["move_prev_long_word_start", "collapse_selection"]

# Vim muscle memory - insert/append collapse selection before entering insert mode
i = ["insert_mode", "collapse_selection"]
a = ["append_mode", "collapse_selection"]

# Vim muscle memory - visual line select, change/delete to EOL, surround
V = ["select_mode", "extend_to_line_bounds"]
C = ["extend_to_line_end", "yank_main_selection_to_clipboard", "delete_selection", "insert_mode"]
D = ["extend_to_line_end", "yank_main_selection_to_clipboard", "delete_selection"]
S = "surround_add"

# Vim clipboard bindings (use system clipboard)
x = "delete_selection"
p = ["paste_clipboard_after", "collapse_selection"]
P = ["paste_clipboard_before", "collapse_selection"]
Y = ["extend_to_line_end", "yank_main_selection_to_clipboard", "collapse_selection"]

# Undo collapses selection like vim
u = ["undo", "collapse_selection"]

# Search for word under cursor (vim * and #)
"#" = ["move_char_right", "move_prev_word_start", "move_next_word_end", "search_selection", "search_prev"]

"tab" = "goto_next_buffer"
"A-." = ["move_prev_word_start", "move_next_word_end", "search_selection"]
"*" = ["move_prev_word_start", "move_next_word_end","search_selection", "make_search_word_bounded"] # SEARCH WORD UNDER CURSOR AS WHOLE WORD !!!!!
q = ":q"
A-q= "replay_macro" # keybinding was 'q'
# Q = ":bc!" this conflicts with record_macro
# g = { a = "code_action" } # Maps `ga` to show possible code actions
# Move by word by Ctrl+left/right
C-home ="goto_file_start"
C-end = "goto_file_end"
# Sort action
C-r = ":config-reload"
C-o = ":config-open"
C-q = ":bc!" # same as yazi (close tab)
# [keys.select.space.x.s]
# s = ":pipe sort"                                                                     # sort lines
# u = ":pipe sort -u"                                                                  # unique lines
# n = ":pipe sort -n"                                                                  # sort lines numeric
# R = ":pipe sort -R"                                                                  # randomize sorting
# m = ":pipe sort -M"                                                                  # sort months (eng)
# i = ":pipe sort -f"                                                                  # sort case insensitive
# d = ":pipe sort -d"                                                                  # sort sort dictionary order
# l = ":pipe awk -vOFS='\t' '{ print length($0), $0 }' | sort -k1,1n -k2,2 | cut -f2-" # Sort by length
# Code actions

# Ctrl + Shift + p -> command palette
C-p = "command_palette"
C-P = "command_palette"
# "A-;" = "toggle_comments"
# Q = ["extend_to_line_bounds", "yank_main_selection_to_clipboard", "paste_primary_clipboard_after"]

# https://www.reddit.com/r/HelixEditor/comments/17tjcb2/add_next_occurence_of_current_word_to_the/
# make sure there is only one selection, select word under cursor, set search to selection, then switch to select mode
"C-d" = ["keep_primary_selection", "move_prev_word_start", "move_next_word_end", "search_selection", "select_mode"]
"C-g" = [":new", ":insert-output lazy-git", ":buffer-close!", ":redraw"]
"C-h" = [":new", ":insert-output tree -f"]
